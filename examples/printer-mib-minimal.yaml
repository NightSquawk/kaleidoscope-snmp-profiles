# Worked example using only standard Printer-MIB (RFC 3805) and Host
# Resources MIB (RFC 2790) objects. Shows the cadence split on a real
# device class. Not imported (examples/ is skipped by the importer).
formatVersion: 1
slug: example-printer-mib-minimal
name: Example — Printer-MIB minimal
description: Smallest useful printer profile. Live supply levels and status every poll, identity on discovery.
deviceCategory: printer
vendor: null
extends: none
priority: 100
enabled: false
pollIntervalSeconds: 900
discoveryIntervalSeconds: 3600

matchPatterns:
  - field: deviceCategory
    pattern: printer

oids:
  # ── every poll ─────────────────────────────────────────────────────
  - oid: 1.3.6.1.2.1.43.11.1.1.9
    name: prtMarkerSuppliesLevel
    metricKey: prtMarkerSuppliesLevel
    type: gauge
    walk: true
    cadenceTier: every-poll
    coalesceKey: [prtMarkerSuppliesIndex]
    description: Current level of the supply. -2 unknown, -3 "some remaining".

  - oid: 1.3.6.1.2.1.43.10.2.1.4
    name: prtMarkerLifeCount
    metricKey: prtMarkerLifeCount
    type: counter
    walk: true
    cadenceTier: every-poll
    coalesceKey: [prtMarkerIndex]
    description: Lifetime page count for the marker.

  - oid: 1.3.6.1.2.1.25.3.5.1.1
    name: hrPrinterStatus
    metricKey: hrPrinterStatus
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex]
    enumMap: { "1": other, "2": unknown, "3": idle, "4": printing, "5": warmup }

  - oid: 1.3.6.1.2.1.25.3.5.1.2
    name: hrPrinterDetectedErrorState
    metricKey: hrPrinterDetectedErrorState
    type: string
    walk: true
    cadenceTier: every-poll        # OCTET STRING bitmap that changes; must not be demoted to discovery
    coalesceKey: [hrDeviceIndex]

  # ── discovery only ─────────────────────────────────────────────────
  - oid: 1.3.6.1.2.1.43.11.1.1.6
    name: prtMarkerSuppliesDescription
    metricKey: prtMarkerSuppliesDescription
    type: string
    walk: true
    cadenceTier: discovery
    coalesceKey: [prtMarkerSuppliesIndex]

  - oid: 1.3.6.1.2.1.43.11.1.1.8
    name: prtMarkerSuppliesMaxCapacity
    metricKey: prtMarkerSuppliesMaxCapacity
    type: integer
    walk: true
    cadenceTier: discovery
    coalesceKey: [prtMarkerSuppliesIndex]

  - oid: 1.3.6.1.2.1.43.5.1.1.17
    name: prtGeneralSerialNumber
    metricKey: prtGeneralSerialNumber
    type: string
    walk: true
    cadenceTier: discovery
    coalesceKey: [hrDeviceIndex]

  - oid: 1.3.6.1.2.1.25.3.2.1.3
    name: hrDeviceDescr
    metricKey: hrDeviceDescr
    type: string
    walk: true
    cadenceTier: discovery
    coalesceKey: [hrDeviceIndex]
