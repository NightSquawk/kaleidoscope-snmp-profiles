formatVersion: 1
slug: kyocera-printer
name: Kyocera Printer
description: "Converted from Datadog's kyocera-printer.yaml SNMP profile. Untested in Kaleidoscope."
deviceCategory: printer
vendor: Kyocera
extends: none
priority: 5
enabled: false
pollIntervalSeconds: 900
matchPatterns:
  - {field: sysObjectId, pattern: 1.3.6.1.4.1.1347.41}
metricsTemplate: {}
oids:
  - oid: 1.3.6.1.2.1.1.5.0
    name: sysName
    metricKey: sysName
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag, metadata], tags: [snmp_host, device_hostname], fields: [device.name], from: [_base.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.18.2.1.3
    name: kcprtAlertStateCode
    metricKey: kcprtAlertStateCode
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtAlertStateDisplayIndex]
    datadog: {as: [metric], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.18.2.1.2
    name: kcprtAlertStateDisplay
    metricKey: kcprtAlertStateDisplay
    type: string
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtAlertStateDisplayIndex]
    datadog: {as: [column-tag], tags: [kcprt_alert_state_display], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.20.1.1.4
    name: kcprtMemoryDeviceTotalSize
    metricKey: kcprtMemoryDeviceTotalSize
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtMemoryDeviceIndex]
    datadog: {as: [metric], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.20.1.1.5
    name: kcprtMemoryDeviceUsedSize
    metricKey: kcprtMemoryDeviceUsedSize
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtMemoryDeviceIndex]
    datadog: {as: [metric], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.20.1.1.2
    name: kcprtMemoryDeviceLocation
    metricKey: kcprtMemoryDeviceLocation
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtMemoryDeviceIndex]
    enumMap: {"0": pcCard-A, "1": pcCard-B, "2": optionROMsocket, "3": residentFont, "4": downloadArea, "5": hardDisk, "6": memoryCard, "255": others}
    datadog: {as: [column-tag], tags: [kcprt_memory_device_location], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.20.1.1.3
    name: kcprtMemoryDeviceType
    metricKey: kcprtMemoryDeviceType
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtMemoryDeviceIndex]
    enumMap: {"0": rom, "1": flash, "2": sram, "3": dram, "4": strage, "255": others}
    datadog: {as: [column-tag], tags: [kcprt_memory_device_type], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.20.1.1.6
    name: kcprtMemoryDeviceStatus
    metricKey: kcprtMemoryDeviceStatus
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [hrDeviceIndex, kcprtMemoryDeviceIndex]
    enumMap: {"0": readyReadWrite, "1": readyReadOnly, "2": notAccessible, "4": lowBattery}
    datadog: {as: [column-tag], tags: [kcprt_memory_device_status], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.5.1.1.1.1
    name: kcprtGeneralModelName
    metricKey: kcprtGeneralModelName_1
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag], tags: [kcprt_general_model_name], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.4.1.1347.43.5.1.1.28.1
    name: kcprtSerialNumber
    metricKey: kcprtSerialNumber_1
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag], tags: [kcprt_serial_number], from: [kyocera-printer.yaml]}
  - oid: 1.3.6.1.2.1.1.1.0
    name: sysDescr
    metricKey: sysDescr
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [metadata], fields: [device.description], from: [_base.yaml]}
  - oid: 1.3.6.1.2.1.1.2.0
    name: sysObjectID
    metricKey: sysObjectID
    type: oid
    walk: false
    cadenceTier: discovery
    datadog: {as: [metadata], fields: [device.sys_object_id], from: [_base.yaml]}
  - oid: 1.3.6.1.2.1.1.6.0
    name: sysLocation
    metricKey: sysLocation
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [metadata], fields: [device.location], from: [_base.yaml]}
origin:
