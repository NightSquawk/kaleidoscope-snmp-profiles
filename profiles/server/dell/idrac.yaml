    name: sysName
    metricKey: sysName
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag, metadata], tags: [snmp_host, device_hostname], fields: [device.name], from: [_base.yaml]}
  - oid: 1.3.6.1.4.1.674.10892.5.4.200.10.1.4
    name: systemStateChassisStatus
    metricKey: systemStateChassisStatus
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [systemStatechassisIndex]
    enumMap: {"1": other, "2": unknown, "3": ok, "4": nonCritical, "5": critical, "6": nonRecoverable}
    datadog: {as: [metric, column-tag], tags: [system_state_chassis_status], from: [_dell-rac.yaml]}
  - oid: 1.3.6.1.4.1.674.10892.5.4.200.10.1.6
    name: systemStatePowerUnitStatusRedundancy
    metricKey: systemStatePowerUnitStatusRedundancy
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [systemStatechassisIndex]
    enumMap: {"1": other, "2": unknown, "3": full, "4": degraded, "5": lost, "6": notRedundant, "7": redundancyOffline}
