formatVersion: 1
slug: idrac
name: iDRAC
description: "Converted from Datadog's idrac.yaml SNMP profile. Untested in Kaleidoscope."
deviceCategory: server
vendor: Dell
extends: none
priority: 5
enabled: false
matchPatterns: []
matchAny:
  - {field: sysObjectId, pattern: 1.3.6.1.4.1.674.10892.2}
  - {field: sysObjectId, pattern: 1.3.6.1.4.1.674.10892.5}
metricsTemplate: {}
oids:
