formatVersion: 1
slug: citrix-netscaler
name: Citrix NetScaler
description: "Converted from Datadog's citrix-netscaler.yaml SNMP profile. Untested in Kaleidoscope."
deviceCategory: generic
vendor: Citrix
extends: none
priority: 5
enabled: false
matchPatterns:
  - {field: sysObjectId, pattern: 1.3.6.1.4.1.5951.1}
metricsTemplate: {}
oids:
