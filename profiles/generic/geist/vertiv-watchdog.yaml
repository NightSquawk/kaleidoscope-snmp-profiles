  - oid: 1.3.6.1.4.1.21239.5.1.1.1.0
    name: productTitle
    metricKey: productTitle
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag], tags: [vertiv_product_title], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.1.2.0
    name: productVersion
    metricKey: productVersion
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag], tags: [vertiv_product_version], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.1.3.0
    name: productFriendlyName
    metricKey: productFriendlyName
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag], tags: [vertiv_product_friendly_name], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.1.4.0
