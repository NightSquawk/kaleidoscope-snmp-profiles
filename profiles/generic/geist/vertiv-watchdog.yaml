formatVersion: 1
slug: vertiv-watchdog
name: Vertiv Watchdog
description: "Converted from Datadog's vertiv-watchdog.yaml SNMP profile. Untested in Kaleidoscope."
deviceCategory: generic
vendor: Geist
extends: none
priority: 5
enabled: false
matchPatterns:
  - {field: sysObjectId, pattern: 1.3.6.1.4.1.21239.5.1}
metricsTemplate: {}
oids:
  - oid: 1.3.6.1.2.1.1.5.0
    name: sysName
    metricKey: sysName
    type: string
    walk: false
    cadenceTier: discovery
    datadog: {as: [global-tag, metadata], tags: [snmp_host, device_hostname], fields: [device.name], from: [_base.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.2.1.5
    name: internalTemp
    metricKey: internalTemp
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [internalIndex]
    datadog: {as: [metric], metric: [vertiv.internalTemp], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.2.1.6
    name: internalHumidity
    metricKey: internalHumidity
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [internalIndex]
    datadog: {as: [metric], metric: [vertiv.internalHumidity], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.2.1.7
    name: internalDewPoint
    metricKey: internalDewPoint
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [internalIndex]
    datadog: {as: [metric], metric: [vertiv.internalDewPoint], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.2.1.2
    name: internalSerial
    metricKey: internalSerial
    type: string
    walk: true
    cadenceTier: every-poll
    coalesceKey: [internalIndex]
    datadog: {as: [column-tag], tags: [vertiv_internal_serial], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.2.1.4
    name: internalAvail
    metricKey: internalAvail
    type: gauge
    walk: true
    cadenceTier: every-poll
    coalesceKey: [internalIndex]
    enumMap: {"0": unavailable, "1": available, "2": partially_unavailable}
    datadog: {as: [column-tag], tags: [vertiv_internal_avail], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.4.1.5
    name: tempSensorTemp
    metricKey: tempSensorTemp
    type: integer
    walk: true
    cadenceTier: every-poll
    coalesceKey: [tempSensorIndex]
    datadog: {as: [metric], metric: [vertiv.tempSensorTemp], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.4.1.2
    name: tempSensorSerial
    metricKey: tempSensorSerial
    type: string
    walk: true
    cadenceTier: every-poll
    coalesceKey: [tempSensorIndex]
    datadog: {as: [column-tag], tags: [vertiv_temp_sensor_serial], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.4.1.3
    name: tempSensorName
    metricKey: tempSensorName
    type: string
    walk: true
    cadenceTier: every-poll
    coalesceKey: [tempSensorIndex]
    datadog: {as: [column-tag], tags: [vertiv_temp_sensor_label], from: [vertiv-watchdog.yaml]}
  - oid: 1.3.6.1.4.1.21239.5.1.4.1.4
    name: tempSensorAvail
    metricKey: tempSensorAvail
    type: gauge
    walk: true
    cadenceTier: every-poll
    coalesceKey: [tempSensorIndex]
    enumMap: {"0": unavailable, "1": available, "2": partially_unavailable}
