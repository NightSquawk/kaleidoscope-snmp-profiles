formatVersion: 1
slug: netscout-switch
name: Netscout Switch
description: "Converted from Datadog's netscout-switch.yaml SNMP profile. Untested in Kaleidoscope."
deviceCategory: generic
vendor: NetScout
extends: none
priority: 5
enabled: false
matchPatterns:
  - {field: sysObjectId, pattern: 1.3.6.1.4.1.21671}
metricsTemplate: {}
