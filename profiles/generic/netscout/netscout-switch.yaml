    metricKey: ifInErrors
    type: counter
    walk: true
    cadenceTier: every-poll
    coalesceKey: [ifIndex]
    datadog: {as: [metric], metricType: [monotonic_count_and_rate], from: [_generic-if.yaml]}
  - oid: 1.3.6.1.2.1.2.2.1.13
