name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tools
      - run: pnpm check-types
        working-directory: tools
      - run: pnpm validate
        working-directory: tools

  # Proves the libsmi toolchain end to end on a fixture MIB. Writes to a temp
  # directory; dictionaries/ is only regenerated by maintainers with real MIBs.
  compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq smitools
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tools
      - run: pnpm compile --mibs fixtures/mibs --out "$RUNNER_TEMP/dict" --report "$RUNNER_TEMP/dict/COMPILE-REPORT.md"
        working-directory: tools
      - name: assert fixture compiled
        run: |
          test -f "$RUNNER_TEMP/dict/cisco/mib-cisco-switch.json"
          node -e 'const d=require(process.argv[1]); if (d.oids.length !== 5) { console.error("expected 5 OIDs, got", d.oids.length); process.exit(1) } const t=Object.fromEntries(d.oids.map(o=>[o.name,o.type])); for (const [k,v] of Object.entries({kspName:"string",kspLoad:"gauge",kspState:"integer",kspEnabled:"integer",kspPortInOctets:"counter"})) if (t[k]!==v) { console.error("type mismatch", k, t[k]); process.exit(1) } console.log("fixture ok", t)' "$RUNNER_TEMP/dict/cisco/mib-cisco-switch.json"
