name: recompile

# Rebuild dictionaries/ whenever the inputs change on main, and commit the
# result through a pull request. Contributors only need MIB files and a registry
# row; libsmi runs here, not on their machine.
on:
  push:
    branches: [main]
    paths:
      - 'mibs/**'
      - 'registry/**'
      - 'manifest.yaml'
      - 'tools/src/**'
      - 'tools/package.json'
      - 'tools/pnpm-lock.yaml'
      - '.github/workflows/recompile.yml'
  workflow_dispatch:

concurrency:
  group: recompile-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recompile:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # Generated PRs touch dictionaries only, outside the triggering input paths.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq smitools
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tools
      - run: pnpm compile --jobs 4
        working-directory: tools
      - run: pnpm validate
        working-directory: tools
      - name: Detect dictionary changes
        id: changes
        run: |
          # Ignore report-only timestamps when dictionary JSON is unchanged.
          if git diff --quiet -- 'dictionaries/*/*.json'; then
            git restore -- dictionaries
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Propose regenerated dictionaries
        if: steps.changes.outputs.changed == 'true'
        id: proposal
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/regenerate-dictionaries
          base: main
          add-paths: dictionaries/
          commit-message: 'chore(dictionaries): regenerate from current inputs'
          title: 'Regenerate SNMP reference dictionaries'
          body: 'Regenerated on a GitHub runner from the current main-branch inputs. Review dictionary changes and compiler diagnostics before merging.'
      - name: Validate the generated PR branch
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REGEN_BRANCH: automation/regenerate-dictionaries
        # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
        # Dispatch validation explicitly; it runs against the proposed branch SHA.
        run: gh workflow run validate.yml --ref "$REGEN_BRANCH"
